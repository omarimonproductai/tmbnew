    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tu et Mous Bé" />
    <title>Tu et Mous Bé · Barcelona</title>

      name="description"
      content="Metro, bus, FGC i Bicing de Barcelona en temps real sobre el mapa: parades a prop teu, favorits i rutes."

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn…). Scrapers don't run JS, so
         these live in the static HTML, not in React. Absolute image URL + a
         square 'summary' card to match the square app icon (avoids the blurry
         upscaled-favicon preview). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tu et Mous Bé" />
    <meta property="og:title" content="Tu et Mous Bé · Barcelona" />
    <meta
      property="og:description"
      content="Metro, bus, FGC i Bicing de Barcelona en temps real sobre el mapa: parades a prop teu, favorits i rutes."
    />
    <meta property="og:url" content="https://tuetmousbe.pages.dev/" />
    <meta property="og:locale" content="ca_ES" />
    <meta property="og:image" content="https://tuetmousbe.pages.dev/pwa-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Tu et Mous Bé" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tu et Mous Bé · Barcelona" />
    <meta
      name="twitter:description"
      content="Metro, bus, FGC i Bicing de Barcelona en temps real sobre el mapa."
    />
    <meta name="twitter:image" content="https://tuetmousbe.pages.dev/pwa-512.png" />

      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

      crossorigin=""
    />
  </head>
